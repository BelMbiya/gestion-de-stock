name: Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Next.js application
        env:
          # URL factice : le client Prisma n'est cree qu'a l'execution des routes API
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
          # Cle factice pour la CI ; la vraie cle va dans les secrets du hebergeur (Vercel, etc.)
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: stock-it-c0557.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: stock-it-c0557
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: stock-it-c0557.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "392508090440"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:392508090440:web:6f143a406362344108907d"
        run: npm run build
